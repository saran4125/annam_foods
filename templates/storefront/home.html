{% extends "base.html" %}
{% block main %}
<main id="main" class="sf-home">
{% for section in storefront_sections %}
  <div data-home-section="{{ section.key }}"{% if section.key != 'hero' and section.key != 'offers' %} class="wrap"{% endif %}>
    {% include section.template %}
  </div>
{% endfor %}
</main>
{% endblock %}
