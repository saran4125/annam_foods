{% extends "base.html" %}{% load storefront_extras %}
{% block title %}Bill {{ invoice.number }} · {{ storefront_brand_name }}{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{% static_v 'css/checkout.css' %}"><style>.bill-table{width:100%;border-collapse:collapse}.bill-table td,.bill-table th{padding:10px;text-align:left;border-bottom:1px solid var(--rule)}.b-table-scroll{max-width:100%;overflow-x:auto}.customer-bill{padding:24px;margin-bottom:40px;border:1px solid var(--rule);border-radius:20px;background:var(--card)}.bill-actions{display:flex;gap:16px;align-items:center;margin:24px 0}@media print{.site-head,.site-foot,.ticker,.wa-float,.bill-actions{display:none!important}.customer-bill{border:0;padding:0}.wrap{width:100%}@page{size:A4;margin:12mm}}</style>{% endblock %}
{% block content %}<div class="bill-actions"><a href="{% url 'storefront:checkout_complete' reference %}">← Back to your order</a><button class="btn" onclick="window.print()">Print / Save as PDF</button></div><div class="customer-bill">{% include "billing/_invoice_body.html" %}</div>{% endblock %}
