name: seerkitchen-foundation
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: seerkitchen
      POSTGRES_USER: seerkitchen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - 127.0.0.1:5439:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U seerkitchen -d seerkitchen]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --save, "", --appendonly, "yes"]
    ports:
      - 127.0.0.1:6389:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
