# Temporary PHP UI preview: free web service, no external database or paid disk.
# Render can still apply its own account-verification requirements.
services:
  - type: web
    name: annam-foods-php-preview
    runtime: docker
    branch: php-rebuild
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.render-php
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: preview
      - key: APP_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: STORE_SLUG
        value: annam
      - key: SEED_OWNER_USERNAME
        value: annam-php-owner
      - key: SEED_OWNER_PASSWORD
        generateValue: true
      - key: PAYMENTS_ENABLED
        value: "0"
      - key: MESSAGING_ENABLED
        value: "0"
      - key: REQUIRE_CRON
        value: "0"
