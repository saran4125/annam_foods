# Render Blueprint -- FREE DEMO. No payment method is required.
#
# Limits of Render's free tier, so nobody is surprised:
#   * The web service goes to sleep after ~15 minutes without visitors; the next
#     visit takes about a minute to wake it.
#   * There is no persistent disk. Files are wiped on every restart, so the
#     catalog photos are downloaded again at each start (a few minutes) and
#     photos uploaded through the owner admin do not survive a restart.
#   * The free Postgres database is deleted after 30 days.
#   * One free Postgres per Render account.
# Good for showing Annam a working preview; not for running the real store.
# For a real store use render.paid.yaml (persistent disk + paid database): in
# Render, set the Blueprint file path to render.paid.yaml.

databases:
  - name: annam-db
    region: singapore
    plan: free
    databaseName: annam
    user: annam

services:
  - type: web
    name: annam-foods
    runtime: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      # Secrets are generated by Render and never appear in the repository.
      - key: SECRET_KEY
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      # The owner's first login: username below, password generated by Render
      # (Dashboard -> annam-foods -> Environment -> SEED_OWNER_PASSWORD).
      - key: SEED_OWNER_USERNAME
        value: annam-owner
      - key: SEED_OWNER_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        fromDatabase: {name: annam-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: annam-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: annam-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: annam-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: annam-db, property: port}
      # The storefront is whichever hostname Render gives the service. The Django
      # super-admin host is parked on a name that cannot resolve; the owner uses
      # /manage/ on the storefront itself.
      - key: ALLOWED_HOSTS
        value: .onrender.com,platform.invalid
      - key: PLATFORM_HOST
        value: platform.invalid
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # No disk: media lives in the instance's temporary storage and is put back
      # from Annam's public image addresses on every start.
      - key: PUBLIC_MEDIA_ROOT
        value: /tmp/media
      - key: PRIVATE_BILLS_ROOT
        value: /tmp/private-bills
      - key: SEED_RESTORE_MEDIA
        value: "1"
      # Demo convenience: changing SEED_OWNER_PASSWORD in Render's dashboard
      # takes effect at the next restart. (Not set in render.paid.yaml, where a
      # password changed inside the app must survive restarts.)
      - key: SEED_SYNC_OWNER
        value: "1"
