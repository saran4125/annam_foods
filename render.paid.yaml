# Render Blueprint: one web service, one Postgres database, one persistent disk.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository, and set
# the Blueprint file path to render.paid.yaml (render.yaml is the free demo).
#
# Costs (check render.com/pricing): the web service must be a paid plan because
# the persistent disk (dish photos and owner uploads) needs one; the free
# Postgres plan is deleted after 30 days, so a small paid database is used.
# Region: Singapore, the nearest to Chennai.

databases:
  - name: annam-db
    region: singapore
    plan: basic-256mb
    databaseName: annam
    user: annam

services:
  - type: web
    name: annam-foods
    runtime: python
    region: singapore
    plan: starter
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /healthz
    disk:
      name: annam-media
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: STORE_SLUG
        value: annam
      # Secrets are generated by Render and never appear in the repository.
      - key: SECRET_KEY
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      # The owner's first login: username below, password generated by Render
      # (Dashboard -> annam-foods -> Environment -> SEED_OWNER_PASSWORD).
      - key: SEED_OWNER_USERNAME
        value: annam-owner
      - key: SEED_OWNER_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        fromDatabase: {name: annam-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: annam-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: annam-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: annam-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: annam-db, property: port}
      # Keep existing hosting/callback addresses compatible. Annam's only admin
      # login is /manage/; PLATFORM_HOST does not expose a platform login.
      - key: ALLOWED_HOSTS
        value: .onrender.com,platform.invalid
      - key: PLATFORM_HOST
        value: platform.invalid
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PUBLIC_MEDIA_ROOT
        value: /var/data/media
      - key: PRIVATE_BILLS_ROOT
        value: /var/data/private-bills
